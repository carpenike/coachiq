# GitHub Actions workflow for Nix-based continuous integration
name: "Nix-based CI"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: "Full CI (pre-commit, tests, lints, lock-check)"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # Diff-aware quality gates (scripts/ruff_diff_check.py,
          # scripts/eslint_diff_check.py) need access to the merge-base
          # with `origin/main`. The default `fetch-depth: 1` (shallow
          # clone) makes `git merge-base` fail, producing false-positive
          # blocks when the base branch advances past the PR's branch
          # base. See issue #116 for the exact failure mode that bit
          # PR #115. The full clone adds a few seconds; the correctness
          # gain is worth it. The `flake-build` job below does NOT need
          # this since it doesn't run diff-aware checks.
          fetch-depth: 0

      - name: "Install Nix (with flakes enabled)"
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: "Setup Nix cache"
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        # Cachix is a soft dependency — a cache miss / revoked token should
        # NOT fail the entire CI run. The build will just be slower.
        continue-on-error: true
        with:
          name: coachiq
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipPush: ${{ github.ref != 'refs/heads/main' }}

      - name: "Perform Nix flake ci"
        run: nix run .#ci

      # - name: "Run tests separately for better caching"
      #   run: nix run .#test

      - name: "Build CoachIQ package (for Cachix caching)"
        run: nix build .#coachiq

  flake-build:
    name: Nix flake checks & build
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: "Install Nix (with flakes enabled)"
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: "Setup Nix cache"
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        # Cachix is a soft dependency — a cache miss / revoked token should
        # NOT fail the entire CI run. The build will just be slower.
        continue-on-error: true
        with:
          name: coachiq
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipPush: ${{ github.ref != 'refs/heads/main' }}

      - name: Run all flake checks (includes lock‑check from checks)
        run: nix flake check

      - name: Build CoachIQ package (for Cachix caching)
        run: nix build .#coachiq
