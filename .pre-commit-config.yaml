# Pragmatic pre-commit configuration for development with technical debt
# This config only blocks on NEW issues in CHANGED files
# Use this during active development, switch to full config when cleaning up

# See https://pre-commit.com for full documentation

# Use whatever python3 the developer has rather than hard-requiring python3.12.
# The interpreter only bootstraps the hook envs; ruff/pyright/bandit lint for
# 3.12 semantics via their own config (ruff target-version = "py312"), so results
# are identical regardless of the running interpreter. Pinning an exact 3.12
# meant commits outside `nix develop` (where 3.12 isn't on PATH) silently failed
# to run hooks and forced --no-verify.
default_language_version:
  python: python3

repos:
  # ===== ALWAYS BLOCKING (Fast, Critical) =====
  # These are quick and catch unambiguous errors
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^(mkdocs\.yml|docs/mkdocs\.yml)$
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-added-large-files
        exclude: >
          (?x)^(
            resources/rvc-2023-11\.pdf|
            resources/rvc-2023-11_chunks\.json
          )$

  # ===== DIFF-AWARE BLOCKING (On Changed Files Only) =====

  # Python linting and formatting with Ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep pinned to the same version poetry resolves so pre-commit's
    # ruff-format hook agrees with `poetry run ruff format`. Without this,
    # pre-commit's ruff (v0.12+) and poetry's ruff (v0.11.x) disagree on
    # whitespace in some files and the gate fails on "file would be
    # reformatted" with no actionable diff visible.
    rev: v0.11.13
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]  # Auto-fix to reduce friction
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  # Security scanning - always blocking for medium+ issues
  - repo: https://github.com/PyCQA/bandit
    rev: '1.8.5'
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml", "--severity-level", "medium"]
        additional_dependencies: ["bandit[toml]"]
        types: [python]

  # Frontend linting on staged files only
  - repo: local
    hooks:
      - id: eslint-staged
        name: eslint --fix (staged files, autofix only)
        # Pre-commit passes paths repo-relative (e.g. frontend/src/foo.tsx).
        # After `cd frontend` those paths are wrong, so we strip the leading
        # `frontend/` from each argument before invoking eslint.
        #
        # We deliberately apply --fix to canonicalize formatting on staged
        # files but treat eslint's exit code as advisory: pre-existing
        # legacy errors should NOT block a commit (the project has ~648
        # baseline errors). The diff-aware gate that BLOCKS on NEW errors
        # lives in `scripts/eslint_diff_check.py` and runs in CI via
        # `scripts/ci-quality-gate.sh` Stage 1.5 -- mirroring how ruff is
        # split into `ruff-format` (file-level autofix) and
        # `ruff_diff_check.py` (line-level gate).
        entry: bash -c 'cd frontend && args=(); for f in "$@"; do args+=("${f#frontend/}"); done; npx eslint --fix --no-error-on-unmatched-pattern -- "${args[@]}" || true' --
        language: system
        files: ^frontend/.*\.(js|jsx|ts|tsx)$
        exclude: ^frontend/(node_modules|dist|coverage|src/api/generated)/
        pass_filenames: true

  # ===== MANUAL/CI-ONLY HOOKS =====
  # These require full project context and are too heavy for every commit

  # Python type checking - moved to manual stage
  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.402
    hooks:
      - id: pyright
        pass_filenames: false
        args: [--project=.]
        stages: [manual]  # Run with: pre-commit run pyright --all-files

  # Frontend full checks - also manual
  - repo: local
    hooks:
      - id: frontend-typecheck-full
        name: TypeScript check (full project)
        entry: bash -c 'cd frontend && npm run typecheck'
        language: system
        pass_filenames: false
        stages: [manual]

      - id: frontend-build-check
        name: Frontend build check
        entry: bash -c 'cd frontend && npm run build'
        language: system
        pass_filenames: false
        stages: [manual]

  # Poetry lock check remains on pre-push as it's important but not blocking
  - repo: local
    hooks:
      - id: check-poetry-lock
        name: poetry-lock-check
        description: "Ensure poetry.lock is in sync with pyproject.toml"
        entry: poetry check --lock
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|poetry\.lock)$
        stages: [pre-push]
